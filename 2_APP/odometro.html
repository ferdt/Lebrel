<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lebrel - Odómetro</title>
    <link rel="stylesheet" href="css/style.css?v=26">
    <style>
        .odo-split-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            width: 100%;
        }

        @media (min-width: 992px) {
            .odo-split-layout {
                grid-template-columns: 450px 1fr;
                align-items: start;
            }
        }

        .odo-left-panel, .odo-right-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .source-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
        }

        .source-info h4 {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .source-value {
            font-size: 1.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .input-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--accent-blue);
            border-radius: 10px;
            padding: 12px;
            margin-top: 6px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: bold;
        }

        .input-group input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            padding: 15px;
            font-size: 2rem;
            text-align: center;
            font-weight: 700;
        }

        .results-box {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--accent-green);
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
        }

        .results-box.visible {
            display: block;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .result-label {
            color: var(--text-secondary);
        }

        .result-value {
            font-weight: bold;
            color: var(--accent-green);
        }

        @media (min-width: 768px) {
            .calibration-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Landscape Optimization */
        @media (orientation: landscape) {
            body {
                overflow: hidden;
            }
            .glass-container {
                height: 100vh;
                height: 100dvh;
                padding-bottom: 5px;
                display: flex;
                flex-direction: column;
            }
            header {
                margin-bottom: 5px !important;
                padding-bottom: 4px !important;
            }
            .odo-split-layout {
                grid-template-columns: 1fr 1.2fr;
                flex: 1;
                height: 100%;
                overflow: hidden;
                gap: 8px;
            }
            .odo-left-panel, .odo-right-panel {
                overflow-y: auto;
                padding-right: 5px;
            }
            .source-card {
                padding: 6px 10px;
            }
            .source-value {
                font-size: 1.4rem;
            }
            .input-box {
                padding: 6px;
                margin-top: 4px;
            }
            #display_real_dist {
                padding: 5px;
                margin-top: 5px;
            }
        }
        .btn-source.active {
            background: var(--accent-blue) !important;
            border-color: var(--accent-blue) !important;
            font-weight: bold;
        }
    </style>
</head>

<body class="dark-theme">
    <div class="glass-container">
        <div id="header-container"></div>
        <main class="odo-split-layout">
            <!-- PANEL IZQUIERDO: Controles y Datos -->
            <div class="odo-left-panel">
                <!-- Selector de Fuente del Odómetro -->
                <div class="source-card" style="flex-direction: column; align-items: stretch; gap: 10px;">
                    <h4 style="color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase;">Fuente del Odómetro</h4>
                    <div class="odo-source-buttons" style="display: flex; gap: 10px;">
                        <button id="btn-source-sensor1" class="btn-source" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.03); color: white; cursor: pointer;">Sensor 1</button>
                        <button id="btn-source-sensor2" class="btn-source" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.03); color: white; cursor: pointer;">Sensor 2</button>
                        <button id="btn-source-gps" class="btn-source" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.03); color: white; cursor: pointer;">GPS</button>
                    </div>
                </div>

                <!-- Fuentes de datos -->
                <div class="source-card" style="border-color: var(--accent-blue);">
                    <div class="source-info">
                        <h4>Distancia GPS</h4>
                        <div id="val_dist_gps" class="source-value">0.000 km</div>
                    </div>
                    <div class="source-info" style="text-align: right;">
                        <h4>Distancia Rally</h4>
                        <div id="val_dist_rally" class="source-value">0.000 km</div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="source-card">
                        <div class="source-info">
                            <h4>Pulsos S1</h4>
                            <div id="val_pulses_1" class="source-value" style="font-size: 1.4rem;">0</div>
                        </div>
                    </div>
                    <div class="source-card">
                        <div class="source-info">
                            <h4>Pulsos S2</h4>
                            <div id="val_pulses_2" class="source-value" style="font-size: 1.4rem;">0</div>
                        </div>
                    </div>
                </div>

                <!-- Entrada de Distancia Conocida -->
                <div class="input-box">
                    <div class="input-group">
                        <label>Distancia Roadbook (km)</label>
                        <div id="display_real_dist" class="edit-input-large" style="cursor: pointer; background: rgba(255,255,255,0.05); margin-top: 10px; font-size: 2.5rem;">0.000</div>
                        <input type="hidden" id="input_real_dist" value="0">
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button id="btn-reset-cal" style="flex: 1; background: rgba(239, 68, 68, 0.1); color: var(--accent-red); border-color: var(--accent-red);">RESET</button>
                        <button id="btn-calculate-cal" style="flex: 2; background: rgba(34, 197, 94, 0.1); color: var(--accent-green); border-color: var(--accent-green);">CALCULAR RATIOS</button>
                    </div>
                </div>

                <!-- Resultados -->
                <div id="results_box" class="results-box">
                    <h3 style="margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; font-size: 1rem;">Ratios Calculados</h3>
                    <div id="results_container"></div>
                    <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
                        <div class="result-item">
                            <span class="result-label">Factor GPS</span>
                            <span id="res_rally_factor" class="result-value">--</span>
                        </div>
                    </div>
                    <button id="btn-save-cal" style="width: 100%; margin-top: 15px; background: var(--accent-blue);">GUARDAR EN HISTORIAL</button>
                </div>
            </div>

            <!-- PANEL DERECHO: Historial -->
            <div class="odo-right-panel">
                <div class="card" style="height: 100%; display: flex; flex-direction: column;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h3 style="margin: 0;">Historial de Calibraciones</h3>
                        <button id="btn-manual-cal" style="padding: 6px 12px; font-size: 0.8rem; background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); border: 1px solid var(--accent-blue);">+ NUEVA MANUAL</button>
                    </div>
                    <div style="overflow-x: auto; flex: 1;">
                        <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem;">
                            <thead style="border-bottom: 1px solid var(--glass-border); text-align: left; position: sticky; top: 0; background: #1e293b;">
                                <tr>
                                    <th style="padding: 10px;">Fecha</th>
                                    <th style="padding: 10px;">Dist. Real</th>
                                    <th style="padding: 10px;">P/km S1</th>
                                    <th style="padding: 10px;">P/km S2</th>
                                    <th style="padding: 10px;">Factor GPS</th>
                                    <th style="padding: 10px; text-align: right;">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="cal_history_body">
                                <!-- Dinámico -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Barra de edición HOMOGENEIZADA -->
    <div id="cell-edit-bar" class="cell-edit-bar">
        <div class="edit-container-full">
            <div class="edit-left">
                <span>Distancia Real (km):</span>
                <input type="text" id="cell-edit-input" class="edit-input-large" readonly>
                <div class="edit-actions-main">
                    <button id="cell-edit-cancel" class="btn-cancel">CANCELAR</button>
                    <button id="cell-edit-ok" class="btn-ok">✓ CONFIRMAR</button>
                </div>
            </div>
            <div class="edit-keypad">
                <button class="btn-key" onclick="pressKey('7')">7</button>
                <button class="btn-key" onclick="pressKey('8')">8</button>
                <button class="btn-key" onclick="pressKey('9')">9</button>
                <button class="btn-key action" onclick="pressKey('back')">⌫</button>

                <button class="btn-key" onclick="pressKey('4')">4</button>
                <button class="btn-key" onclick="pressKey('5')">5</button>
                <button class="btn-key" onclick="pressKey('6')">6</button>
                <button class="btn-key special" onclick="pressKey('clear')">C</button>

                <button class="btn-key" onclick="pressKey('1')">1</button>
                <button class="btn-key" onclick="pressKey('2')">2</button>
                <button class="btn-key" onclick="pressKey('3')">3</button>
                <button class="btn-key special" onclick="pressKey('.')">.</button>

                <button class="btn-key zero-wide" onclick="pressKey('0')" style="grid-column: span 4;">0</button>
            </div>
        </div>
    </div>

    <!-- Modal Calibración Manual / Edición -->
    <div id="modal-manual" class="cell-edit-bar" style="z-index: 1001;">
        <div class="edit-container-full" style="flex-direction: column; align-items: stretch; padding: 20px;">
            <h3 id="manual-title" style="margin-bottom: 15px;">Nueva Calibración Manual</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label style="font-size: 0.8rem; color: var(--text-secondary);">Distancia Real (km)</label>
                    <input type="number" step="0.001" id="man-dist" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); color: white; border-radius: 5px;">
                </div>
                <div class="form-group">
                    <label style="font-size: 0.8rem; color: var(--text-secondary);">Factor GPS</label>
                    <input type="number" step="0.0001" id="man-factor" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); color: white; border-radius: 5px;">
                </div>
                <div class="form-group">
                    <label style="font-size: 0.8rem; color: var(--text-secondary);">P/km Sensor 1</label>
                    <input type="number" step="0.1" id="man-p1" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); color: white; border-radius: 5px;">
                </div>
                <div class="form-group">
                    <label style="font-size: 0.8rem; color: var(--text-secondary);">P/km Sensor 2</label>
                    <input type="number" step="0.1" id="man-p2" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); color: white; border-radius: 5px;">
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button id="btn-manual-cancel" class="btn-cancel" style="flex: 1;">CANCELAR</button>
                <button id="btn-manual-save" class="btn-ok" style="flex: 2;">✓ GUARDAR</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app_calibracion.js?v=26"></script>
</body>

</html>
