<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lebrel - Piloto</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="css/style.css?v=26">
    <style>
        .grid-dashboard {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        /* Error Bars */
        .error-bars-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            margin-bottom: 4px;
        }

        .error-bar-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 3px;
        }

        .error-bar-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .error-bar-label .short-label {
            display: none;
        }

        .error-bar-bg {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            height: 14px;
            position: relative;
            overflow: hidden;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .error-bar-center {
            position: absolute;
            left: 50%;
            width: 2px;
            height: 100%;
            background: var(--text-secondary);
            opacity: 0.5;
            z-index: 2;
        }

        .error-bar-fill {
            position: absolute;
            z-index: 1;
            transition: width 0.1s ease, height 0.1s ease;
        }

        .error-bar-fill.negative-fill {
            right: 50%;
            background: var(--accent-red);
            width: 0%;
            height: 100%;
        }

        .error-bar-fill.positive-fill {
            left: 50%;
            background: var(--accent-green);
            width: 0%;
            height: 100%;
        }

        /* 1. Sugerencia de conducción */
        .card-instruction {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.05);
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #val_instruccion {
            font-size: clamp(0.5rem, 7vw, 7rem);
            font-weight: 900;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        /* 2. Intervalo y Velocidad */
        .row-interval-speed {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 8px;
        }

        .card-interval,
        .card-speed {
            padding: 6px 8px;
            border-radius: 10px;
        }

        #val_diferencia_ideal {
            font-size: clamp(3rem, 12vw, 5rem);
        }

        #val_velocidad_actual {
            font-size: clamp(3rem, 12vw, 4rem);
            color: var(--text-primary);
        }

        /* 3. Odómetro */
        .card-odo-total {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(59, 130, 246, 0.05));
            border-color: rgba(59, 130, 246, 0.3);
            padding: 12px 10px;
            border-radius: 10px;
        }

        /* 4. Odómetro Parcial y Media Reset */
        .row-partial-reset {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .row-partial-reset .card {
            padding: 8px 6px;
            border-radius: 10px;
        }

        /* 5. Cambio de Media */
        .card-next-media {
            display: flex;
            flex-direction: row !important;
            justify-content: space-between !important;
            align-items: center;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
        }

        .media-info-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .media-info-group.right {
            align-items: flex-end;
        }

        .sub-value {
            font-size: clamp(1rem, 4vw, 1.8rem);
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .label-small {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 3px;
        }

        #btn-reset-parcial {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--accent-red);
            border-radius: 12px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        #btn-reset-parcial:active {
            background: rgba(239, 68, 68, 0.2);
            transform: scale(0.98);
        }

        /* Definir grid areas para todos los elementos */
        .card-instruction {
            grid-area: instruction;
        }

        .error-bars-container {
            grid-area: error_bars;
        }

        .row-interval-speed {
            grid-area: interval_speed;
        }

        .card-odo-total {
            grid-area: odo_total;
        }

        .row-partial-reset {
            grid-area: partial_reset;
        }

        .card-next-media {
            grid-area: next_media;
        }

        .buttons-container {
            grid-area: buttons;
            margin-top: auto !important;
        }

        @media (min-width: 769px) and (orientation: portrait) {
            .grid-dashboard {
                display: grid;
                grid-template-columns: 1fr;
                max-width: 800px;
                margin: 0 auto;
            }
        }

        /* Landscape optimization (Apaisado) */
        @media (orientation: landscape) {
            body {
                overflow: hidden; /* Evitar scroll vertical */
            }
            .glass-container {
                height: 100vh;
                height: 100dvh;
                padding-bottom: 5px;
            }
            .row-interval-speed { display: contents; }
            .row-partial-reset { display: contents; }
            
            .card-interval { grid-area: interval; }
            .card-speed { grid-area: speed; }
            .card-media-reset { grid-area: media_reset; }
            .card-odo-parcial { grid-area: odo_parcial; }
            
            .grid-dashboard {
                display: grid;
                grid-template-columns: auto 1fr 1.3fr 1fr;
                grid-template-areas:
                    "error_bars interval  instruction media_reset"
                    "error_bars interval  speed       odo_parcial"
                    "error_bars odo_total speed       odo_parcial"
                    "error_bars odo_total next_media  buttons";
                gap: 5px;
                flex: 1;
                max-width: 100%;
                margin: 0;
            }

            .error-bars-container {
                flex-direction: row;
                height: 100%;
                width: auto;
                min-width: 50px;
                gap: 8px;
                margin-bottom: 0;
                padding: 4px 0;
            }

            .error-bar-wrapper {
                flex-direction: column-reverse;
                height: 100%;
                width: 18px;
                align-items: center;
                gap: 4px;
            }

            .error-bar-label {
                font-size: 0.65rem;
                font-weight: 800;
                letter-spacing: 0px;
                text-align: center;
            }

            .error-bar-label .full-label {
                display: none;
            }

            .error-bar-label .short-label {
                display: inline;
            }

            .error-bar-bg {
                flex: 1;
                width: 100%;
                height: 100%;
                flex-direction: column;
            }

            .error-bar-center {
                left: 0;
                top: 50%;
                width: 100%;
                height: 2px;
            }

            .error-bar-fill {
                width: 100%;
                height: 0%;
            }

            .error-bar-fill.negative-fill {
                top: 50%;
                right: auto;
                background: var(--accent-red);
            }

            .error-bar-fill.positive-fill {
                bottom: 50%;
                left: auto;
                background: var(--accent-green);
            }

            /* Ajustes de tamaño en landscape para que quepa todo */
            header {
                margin-bottom: 5px !important;
                padding-bottom: 4px !important;
            }

            .card-instruction {
                min-height: auto;
                padding: 0px;
            }

            #val_instruccion {
                font-size: clamp(1rem, 6dvh, 4rem) !important;
            }

            .card-interval,
            .card-speed {
                padding: 5px;
            }

            .card-odo-total {
                padding: 5px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            #val_distancia {
                font-size: clamp(1.2rem, 8dvh, 4rem) !important;
            }

            #val_diferencia_ideal {
                font-size: clamp(1.2rem, 8dvh, 4rem) !important;
            }

            #val_velocidad_actual {
                font-size: clamp(1.2rem, 8dvh, 3.5rem) !important;
            }

            .card-next-media {
                padding: 5px 8px;
            }

            .row-partial-reset .card {
                padding: 5px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            #val_media_reset,
            #val_odo_parcial {
                font-size: clamp(1rem, 5dvh, 2.2rem) !important;
            }

            .buttons-container button {
                padding: 8px !important;
            }
        }

        /* Si es apaisado pero extremadamente alargado (más columnas) */
        @media (orientation: landscape) and (min-aspect-ratio: 2/1) {
            .grid-dashboard {
                grid-template-columns: auto 1fr 1.2fr 1fr 1fr;
                grid-template-areas:
                    "error_bars interval  instruction odo_total   media_reset"
                    "error_bars interval  instruction odo_total   odo_parcial"
                    "error_bars speed     next_media  buttons     buttons";
            }
        }
    </style>
</head>

<body class="dark-theme">
    <div class="glass-container">
        <div id="header-container"></div>

        <main class="grid-dashboard">
            <div class="card card-instruction">
                <div id="val_instruccion">--</div>
            </div>

            <!-- Error Bars (Interval & Speed to Ideal) -->
            <div class="error-bars-container">
                <div class="error-bar-wrapper">
                    <span class="error-bar-label">
                        <span class="full-label">Intervalo</span>
                        <span class="short-label">Int.</span>
                    </span>
                    <div class="error-bar-bg">
                        <div class="error-bar-center"></div>
                        <div id="interval-error-left" class="error-bar-fill negative-fill"></div>
                        <div id="interval-error-right" class="error-bar-fill positive-fill"></div>
                    </div>
                </div>
                <div class="error-bar-wrapper">
                    <span class="error-bar-label">
                        <span class="full-label">Velocidad</span>
                        <span class="short-label">Vel.</span>
                    </span>
                    <div class="error-bar-bg">
                        <div class="error-bar-center"></div>
                        <div id="speed-error-left" class="error-bar-fill negative-fill"></div>
                        <div id="speed-error-right" class="error-bar-fill positive-fill"></div>
                    </div>
                </div>
            </div>

            <!-- 2. Intervalo y velocidad -->
            <div class="row-interval-speed">
                <div class="card card-interval">
                    <div class="label-small">Intervalo</div>
                    <div id="val_diferencia_ideal" class="value positive">+0.0</div>
                </div>
                <div class="card card-speed">
                    <div class="label-small">Velocidad</div>
                    <div class="value"><span id="val_velocidad_actual">0.0</span> <span id="val_velocidad_objetivo"
                            style="color:var(--text-secondary); font-size:clamp(0.5rem, 4vmin, 2rem);">0.0</span>
                    </div>
                </div>
            </div>

            <!-- 3. Odómetro -->
            <div class="card card-odo-total">
                <div class="label-small">Odómetro Total</div>
                <div id="val_distancia" class="value" style="font-size: clamp(3.5rem, 12vw, 5rem);">0.000</div>
            </div>

            <!-- 4. Odómetro parcial y velocidad media desde reset -->
            <div class="row-partial-reset">
                <div class="card card-media-reset">
                    <div class="label-small">Media Parcial</div>
                    <div id="val_media_reset" class="value" style="font-size: 2.2rem;">0.0</div>
                </div>
                <div class="card card-odo-parcial">
                    <div class="label-small">Parcial</div>
                    <div id="val_odo_parcial" class="value" style="font-size: 2.2rem;">0.000</div>
                </div>
            </div>

            <!-- 5. Cambio de media -->
            <div class="card card-next-media">
                <div class="media-info-group">
                    <div class="label-small">Próxima Media</div>
                    <div id="val_proxima_media" class="value" style="font-size: 2rem; color: var(--accent-blue);">0.0
                    </div>
                </div>
                <div class="media-info-group right">
                    <div class="label-small">Distancia Cambio</div>
                    <div id="val_distancia_cambio" class="value" style="font-size: 2rem;">--</div>
                </div>
            </div>

            <!-- Ayudas sonoras y Botón de Reset Odo Parcial -->
            <div class="buttons-container" style="display: flex; gap: 8px; margin-top: 6px;">
                <button id="btn-sound-aids"
                    style="flex: 1; padding: 10px; font-size: 0.9rem; background: rgba(59, 130, 246, 0.1); border: 1px solid var(--accent-blue); color: var(--accent-blue); border-radius: 8px; cursor: pointer;">
                    AYUDA SONORA: <span id="val-sound-aids">ON</span>
                </button>
                <button id="btn-reset-parcial"
                    style="flex: 1; padding: 10px; font-size: 0.9rem; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--accent-red); color: var(--accent-red); border-radius: 8px; cursor: pointer;">
                    RESET PARCIAL
                </button>
            </div>
        </main>
    </div>


    <!-- Cargar JS como module -->
    <script type="module" src="js/app_piloto.js?v=26"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js?v=26').catch(err => console.log('SW Fail:', err));
            });
        }
    </script>
</body>

</html>
